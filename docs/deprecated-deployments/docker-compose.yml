# Docker Compose for HCS Chatbot

services:
  # Frontend service
  hcs-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3001:80"
    depends_on:
      - hcs-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - REACT_APP_API_URL=http://localhost:8000
    networks:
      - hcs-network

  # Backend service
  hcs-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - redis
    restart: unless-stopped
    environment:
      - PYTHONPATH=/app
      - LLM_PROVIDER=openai
      - USE_LOCAL_LLM=false
      - USE_OLLAMA=false
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-4o-mini
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - chroma_data:/app/chroma_db
      - ./PDFs:/app/pdfs
    networks:
      - hcs-network

  # Local LLM service (Ollama) - Optional, keeping for future use
  # ollama:
  #   image: ollama/ollama:latest
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   environment:
  #     - OLLAMA_HOST=0.0.0.0
  #     - OLLAMA_ORIGINS="*"
  #   restart: unless-stopped
  #   networks:
  #     - hcs-network

  # Cloudflare tunnel (optional - can run separately)
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml --protocol http2 run hcs-api
    volumes:
      - ./tunnel-config.yml:/etc/cloudflared/config.yml:ro
      - /Users/mediaserver/.cloudflared:/home/nonroot/.cloudflared:ro
    depends_on:
      - hcs-backend
    restart: unless-stopped
    networks:
      - hcs-network

  # Redis for caching (optional but recommended for performance)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - hcs-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  ollama_data:
    driver: local
  chroma_data:
    driver: local
  redis_data:
    driver: local

networks:
  hcs-network:
    driver: bridge